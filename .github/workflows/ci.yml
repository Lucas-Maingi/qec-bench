name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12"]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[fusion,train,dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Smoke test CLI
        run: |
          qecbench --version
          qecbench generate --config configs/datasets/dev.yaml --out /tmp/data
          qecbench benchmark --dataset /tmp/data/dev --decoders pymatching --out /tmp/results.json
